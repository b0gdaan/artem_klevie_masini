# Smoke experiment: complete pipeline on the committed synthetic snapshot, no network.
# The site is fictional and the effects are injected (see data/raw/smoke/ground_truth.json).
schema_version: 1
name: smoke
mode: synthetic
seed: 42

data:
  snapshot: data/raw/smoke
  gsc_lag_days: 3              # Search Console values are treated as final after 3 days
  analysis_cutoff: "2026-09-10"

design:
  pre_days: 42                 # 6 weeks before the buffer
  buffer_days: 7               # excluded week right before the change
  ramp_days: 14                # indexing/ramp-up period excluded after the change
  post_days: 42                # 6 weeks of evaluation
  min_post_days: 28
  min_days_per_window: 20
  control_group: control
  placebo_shift_days: 63       # fake change date, entirely before the real one

inference:
  bootstrap_reps: 2000
  ci_level: 0.95
  multiplicity: bonferroni     # 4 inferential hypotheses -> 98.75 % intervals decide

hypotheses:
  - id: H1
    kind: did
    intervention: technical
    metric: position
    segment: all
    threshold: 0.20
    statement_sl: "Tehnična optimizacija izboljša povprečni položaj optimiziranih strani za vsaj 20 % glede na kontrolne strani."
    limitation_sl: "Povprečni položaj v GSC je utežen s prikazi in se spreminja tudi z naborom poizvedb."
  - id: H2
    kind: did
    intervention: content
    metric: ctr_adjusted
    segment: all
    threshold: 0.15
    statement_sl: "Vsebinska optimizacija poveča CTR, prilagojen položaju, za vsaj 15 % v 6 tednih po uvajalnem obdobju."
    limitation_sl: "Pričakovani CTR je ocenjen iz podatkov pred prvim ukrepom; krivulja ne loči vrst rezultatov (npr. AI Overviews)."
  - id: H3
    kind: did_difference
    intervention: local
    compare_to: content
    metric: clicks
    segment: local
    threshold: 0.0
    statement_sl: "Lokalna optimizacija poveča klike iz lokalnih poizvedb bolj kot splošna vsebinska optimizacija."
    limitation_sl: "Velja za eno spletišče; ne posplošuje na vsa slovenska MSP."
  - id: H4
    kind: did
    intervention: accessibility
    metric: position
    segment: all
    threshold: 0.0
    statement_sl: "Izboljšave dostopnosti (WCAG 2.1) izboljšajo povprečni položaj strani."
    limitation_sl: "Google dostopnosti ne navaja kot neposrednega dejavnika uvrščanja; ničelni rezultat je pričakovan izid."
  - id: H5
    kind: descriptive
    intervention: links
    metric: domain_authority
    threshold: 10
    horizon_days: 183
    statement_sl: "Gradnja povratnih povezav v 6 mesecih poveča Domain Authority za vsaj 10 točk (opisno, brez kontrolne skupine)."
    limitation_sl: "Domain Authority je metrika podjetja Moz, ne Googla; ena časovna vrsta ne omogoča vzročnega sklepa."

required_stages: [ingest, validate, transform, split, fit, predict, evaluate, diagnostics, report]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "research"
version = "0.1.0"
description = "Reproducible SEO audit and before/after measurement pipeline for a diploma thesis"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: runs the full pipeline on the smoke snapshot"]
